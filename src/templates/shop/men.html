{% extends "base.html" %}
{% block title %}Refiber-shop{% endblock %}

 
{% block content %}


<div class="buttons-container">
    <a><button class="oval-button men" style="background-color: orange;">men</button></a>
    <a href="/shop/women"><button class="oval-button women">Women</button></a>
    <a href="/shop/new-arrivals"><button class="oval-button new-arrivals">New arrivals</button></a>
</div>




<section class="shop-page">
    <form action="/cart"  method="post">
        <div class="grid-item pants">
            <input name="id" type="hidden" value="101">
            <input name="product-name" type="hidden" value="Men's refiber-pants">
            <input name="price" type="hidden" value="10.00">
            <input name="image_url" type="hidden" value="../static/refiber_clothes/pants.png">
            <img src="../static/refiber_clothes/pants.png" alt="pants" class="grid-image">
            <h2>refiber-pants</h2>
            <p>$10.00</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </div>
    </form>
    <form action="/cart"  method="post">
        <div class="grid-item jacket">
            <input name="id" type="hidden" value="102">
            <input name="product-name" type="hidden" value="Men's refiber-jacket">
            <input name="price" type="hidden" value="19.99">
            <input name="image_url" type="hidden" value="../static/refiber_clothes/jacket.png">
            <img src="../static/refiber_clothes/jacket.png" alt="jacket">
            <h2>refiber-jacket</h2>
            <p>$19.99</p>
            <button class="add-to-cart-btn" data-item-id="2">Add to Cart</button>
        </div>
    </form>
    <form action="/cart" method="post">
        <div  class="grid-item shirt">
            <input name="id" type="hidden" value="103">
            <input name="product-name" type="hidden" value="Men's refiber-shirt">
            <input name="price" type="hidden" value="9.99">
            <input name="image_url" type="hidden" value="../static/refiber_clothes/shirt.png">
            <img src="../static/refiber_clothes/shirt.png" alt="shirt">
            <h2>refiber-shirt</h2>
            <p>$9.99</p>
            <button class="add-to-cart-btn" data-item-id="3">Add to Cart</button>
        </div>
    </form>

    <form action="/cart" method="post">
        <div class="grid-item shorts">
            <input name="id" type="hidden" value="104">
            <input name="product-name" type="hidden" value="Men's refiber-shorts">
            <input name="price" type="hidden" value="9.99">
            <input name="image_url" type="hidden" value="../static/refiber_clothes/shorts.png">
            <img src="../static/refiber_clothes/shorts.png" alt="shorts">
            <h2>refiber-shorts</h2>
            <p>$9.99</p>
            <button class="add-to-cart-btn" data-item-id="4">Add to Cart</button>
        </div>
    </form>

    <!-- Add more product entries as needed -->
</section>


{% endblock %}
