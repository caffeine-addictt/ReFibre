<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <!-- Group CSS stylesheet -->
    <link href="{{ url_for('static', filename='stylesheet.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='checkout.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='testing1.css')}}" rel="stylesheet">
    <link href="{{ url_for('static', filename='confirmation.css')}}" rel="stylesheet">
    <!-- bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!-- Option 1: Include in HTML -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>

<body>
    {% block navbar%}
    
        {% if session["user"] %}
            {% include 'includes/_navbarAcc.html' %}
        {% else %}
            {% include 'includes/_navbar.html' %}
        {% endif %}
    
    {% endblock %}

    <div class="container-fluid">
        {% block content %}
        {% endblock %}
    </div>

    {% block footer %}
    {% include 'includes/_footer.html' %}
    {% endblock %}

    {% block scripts %}
    <!-- Group custom Javascript-->
    <script src="{{ url_for('static', filename='customJS.js') }}"></script>
    <!-- Popper 2.10.2, Bootstrap 5.1.3 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
    {%endblock%}
</body>

</html>
