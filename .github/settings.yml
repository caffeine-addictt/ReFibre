# These settings are synced to GitHub by https://probot.github.io/apps/settings/

repository:
  # See https://docs.github.com/en/rest/reference/repos#update-a-repository for all available settings.

  # The name of the repository. Changing this will rename the repository
  name: ReFibre

  # A short description of the repository that will show up on GitHub
  description: NYP Semester 2, group3 appdev project

  # A comma-separated list of topics to set on the repository
  topics: environment, python3, flask-application, clothing 

  # Either `true` to make the repository private, or `false` to make it public.
  private: true

  # Either `true` to enable issues for this repository, `false` to disable them.
  has_issues: true

  # Either `true` to enable projects for this repository, or `false` to disable them.
  # If projects are disabled for the organization, passing `true` will cause an API error.
  has_projects: true

  # Either `true` to enable the wiki for this repository, `false` to disable it.
  has_wiki: false

  # Either `true` to enable downloads for this repository, `false` to disable them.
  has_downloads: true

  # Updates the default branch for this repository.
  default_branch: main

  # Either `true` to allow squash-merging pull requests, or `false` to prevent
  # squash-merging.
  allow_squash_merge: false

  # Either `true` to allow merging pull requests with a merge commit, or `false`
  # to prevent merging pull requests with merge commits.
  allow_merge_commit: true

  # Either `true` to allow rebase-merging pull requests, or `false` to prevent
  # rebase-merging.
  allow_rebase_merge: false

  # Either `true` to enable automatic deletion of branches on merge, or `false` to disable
  delete_branch_on_merge: false

  # Either `true` to enable automated security fixes, or `false` to disable
  # automated security fixes.
  enable_automated_security_fixes: true

  # Either `true` to enable vulnerability alerts, or `false` to disable
  # vulnerability alerts.
  enable_vulnerability_alerts: true




# Labels: define labels for Issues and Pull Requests
labels:
  - name: 'Type: Bug'
    color: e80c0c
    description: Something isn't working as expected.

  - name: 'Type: Enhancement'
    color: 54b2ff
    description: Suggest an improvement for an existing feature.

  - name: 'Type: Feature'
    color: 54b2ff
    description: Suggest a new feature.

  - name: 'Type: Security'
    color: fbff00
    description: A problem or enhancement related to a security issue.

  - name: 'Type: Question'
    color: 9309ab
    description: Request for information.

  - name: 'Type: Test'
    color: ce54e3
    description: A problem or enhancement related to a test.

  - name: 'Status: Awaiting Review'
    color: 24d15d
    description: Ready for review.

  - name: 'Status: WIP'
    color: 07b340
    description: Currently being worked on.

  - name: 'Status: Waiting'
    color: 38C968
    description: Waiting on something else to be ready.

  - name: 'Status: Stale'
    color: 66b38a
    description: Has had no activity for some time.

  - name: 'Duplicate'
    color: EB862D
    description: Duplicate of another issue.

  - name: 'Invalid'
    color: faef50
    description: This issue doesn't seem right.

  - name: 'Priority: High +'
    color: ff008c
    description: Task is considered higher-priority.

  - name: 'Priority: Low -'
    color: 690a34
    description: Task is considered lower-priority.

  - name: 'Documentation'
    color: 2fbceb
    description: An issue/change with the documentation.

  - name: "Won't fix"
    color: C8D9E6
    description: Reported issue is working as intended.

  - name: '3rd party issue'
    color: e88707
    description: This issue might be caused by a 3rd party script/package/other reasons

  - name: 'Os: Windows'
    color: AEB1C2
    description: Is Windows-specific

  - name: 'Os: Mac'
    color: AEB1C2
    description: Is Mac-specific

  - name: 'Os: Linux'
    color: AEB1C2
    description: Is Linux-specific
